<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>반응 속도 탐구 프로젝트 제안서 및 시뮬레이터</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
body{font-family:'Noto Sans KR',sans-serif;background:#f3f4f6}
textarea,input[type="text"],select{width:100%;border:1px solid #d1d5db;border-radius:.375rem;padding:.5rem;font-size:.875rem;word-break:keep-all}
textarea:focus,input[type="text"]:focus,select:focus{outline:none;border-color:#3b82f6}
.loader{border:4px solid #f3f3f3;border-top:4px solid #3b82f6;border-radius:50%;width:40px;height:40px;animation:spin 1s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
#custom-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;align-items:center;justify-content:center}
</style>
</head>
<body class="text-gray-800 pb-20 relative">
<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6">
<div id="print-area" class="bg-white p-8 rounded-xl shadow-lg border border-gray-200 mx-auto" style="max-width:1000px">
<div class="border-b-4 border-blue-800 pb-4 mb-6 flex flex-col gap-4">
<div class="text-center w-full">
<h1 class="text-2xl md:text-4xl font-extrabold text-gray-900 mb-3 whitespace-nowrap tracking-tight leading-tight">[반응 속도 탐구 프로젝트] 탐구 제안서 및 요약 보고서</h1>
<p class="text-base md:text-lg text-gray-600 font-medium">2학년 물질과 에너지 수행평가</p>
</div>
<div class="flex justify-end w-full"><div class="flex flex-row gap-4 items-center bg-blue-50 p-3 rounded-lg border border-blue-200 whitespace-nowrap">
<div class="flex items-center gap-2"><label class="font-bold text-blue-900">교실</label><input type="text" id="classroom" placeholder="입력" class="w-16 text-center border-blue-300"></div>
<div class="flex items-center gap-2"><label class="font-bold text-blue-900">학번</label><input type="text" id="studentId" placeholder="입력" class="w-20 text-center border-blue-300"></div>
<div class="flex items-center gap-2"><label class="font-bold text-blue-900">이름</label><input type="text" id="studentName" placeholder="입력" class="w-20 text-center border-blue-300"></div>
</div></div></div>

<section class="mb-8">
<h2 class="text-lg font-bold bg-blue-100 text-blue-800 p-2 rounded mb-4"><i class="fa-solid fa-pen mr-2"></i>1. 탐구 개요</h2>
<div class="grid grid-cols-1 md:grid-cols-12 gap-4">
<div class="md:col-span-2 font-bold pt-2 border-r">탐구 주제</div><div class="md:col-span-10"><input type="text" id="topic" placeholder="탐구 주제 작성"></div>
<div class="md:col-span-2 font-bold pt-2 border-r">탐구 동기</div><div class="md:col-span-10"><textarea id="motive" rows="3" placeholder="구체적인 사례(교과서, 뉴스 기사 등)를 들어 탐구의 필요성 작성 (120~140자)"></textarea></div>
<div class="md:col-span-2 font-bold pt-2 border-r">탐구 목적</div><div class="md:col-span-10"><textarea id="purpose" rows="3" placeholder="두 가지 실험(I, II)을 실시하는 이유와 화학의 유용성 관련지어 작성"></textarea></div>
</div></section>

<div class="mb-5 p-4 bg-slate-50 border rounded-xl flex flex-col md:flex-row md:items-center justify-between gap-3">
<div><p class="font-bold"><i class="fa-solid fa-floppy-disk mr-1"></i>작성 내용 저장</p><p class="text-xs text-slate-600 mt-1">작성 중인 내용은 5초마다 이 브라우저에 자동 저장됩니다.</p></div>
<div class="flex flex-wrap gap-2">
<button onclick="saveDraftLocally()" class="bg-emerald-600 text-white text-sm font-bold py-2 px-4 rounded-lg">저장하기</button>
<button onclick="loadDraftLocally()" class="bg-white text-emerald-800 border border-emerald-300 text-sm font-bold py-2 px-4 rounded-lg">저장 내용 불러오기</button>
<button id="btn-draft-combined" onclick="submitFirstDraft()" class="bg-slate-700 text-white text-sm font-bold py-2 px-5 rounded-lg"><i class="fa-solid fa-paper-plane mr-1"></i>1차 제출하기</button>
</div></div>

<div id="combined-feedback-area" class="mt-8 p-6 bg-indigo-50 border border-indigo-200 rounded-2xl">
<div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3">
<div><h3 class="text-lg font-bold text-indigo-900">실험 Ⅰ·Ⅱ 통합 AI 피드백</h3><p class="text-sm text-indigo-700 mt-1">1차 제출 후 두 실험을 한 번에 점검합니다.</p>
<p class="text-sm font-medium text-indigo-800 mt-2"><i class="fa-solid fa-circle-info mr-1"></i>AI 피드백은 선택 사항이며, 피드백을 받지 않아도 최종 제출할 수 있습니다.</p></div>
<button id="btn-feedback-combined" onclick="getCombinedFeedback()" disabled class="bg-indigo-600 text-white font-bold py-3 px-5 rounded-xl opacity-50 cursor-not-allowed"><i class="fa-solid fa-wand-magic-sparkles mr-2"></i>피드백<br>받기</button>
</div>
<p id="feedback-lock-message" class="text-xs text-gray-500 mt-2 text-right">1차 제출을 완료하면 버튼이 활성화됩니다.</p>
<div id="combined-loading" class="hidden mt-5 text-center text-indigo-700"></div>
<div id="combined-feedback-result" class="hidden mt-5 p-4 bg-white border border-indigo-100 rounded-xl text-sm"></div>
</div>
<div class="h-4"></div>

<script>
function experimentHtml(n,color){
 const c=color;
 return `<section class="mb-10 border-2 border-${c}-800 rounded-lg overflow-hidden">
 <div class="bg-${c}-800 text-white font-bold p-3 text-lg">실험 ${n===1?'Ⅰ':'Ⅱ'} 설계</div>
 <div class="p-4 grid grid-cols-1 lg:grid-cols-2 gap-6"><div>
 <div class="mb-4"><label class="font-bold block mb-1">탐구 가설 ${n}</label><textarea id="exp${n}-hypothesis" rows="2" placeholder="조작 변인과 종속 변인을 포함하여 인과 관계가 드러나게 작성"></textarea></div>
 <div class="bg-gray-50 p-3 rounded border mb-4"><span class="font-bold text-${c}-700 block mb-2">변인 설정 및 조건값 (3개)</span>
 <div class="flex items-center gap-2 mb-2"><span class="text-sm font-semibold w-20">조작 변인 ${n}</span><select id="exp${n}-var" class="w-32"><option>농도</option><option>표면적</option><option>온도</option><option>촉매</option></select></div>
 <div class="flex gap-2 mb-2"><input id="exp${n}-cond1" placeholder="조건 1 값 입력"><input id="exp${n}-cond2" placeholder="조건 2 값 입력"><input id="exp${n}-cond3" placeholder="조건 3 값 입력"></div>
 <div class="flex items-center gap-2 mt-3"><span class="text-sm font-semibold w-20">종속 변인 ${n}</span><input id="exp${n}-dep" placeholder="종속 변인 작성"></div></div>
 <div class="mb-4"><label class="font-bold block mb-1">탐구 과정 (최소 3단계 ~ 최대 5단계)</label><div id="exp${n}-steps" class="flex flex-col gap-2">${[1,2,3,4,5].map(i=>`<div class="flex gap-2"><span class="w-5 font-bold text-gray-500">${i}</span><textarea rows="4" placeholder="과정 ${i} 입력${i>3?' (선택)':''}"></textarea></div>`).join('')}</div></div>
 <div class="bg-gray-50 p-3 rounded border"><span class="font-bold text-${c}-700 block mb-2">그래프 축 설정</span>
 <div class="flex gap-2 mb-2"><span class="font-semibold w-12">X축</span><input id="exp${n}-xaxis" placeholder="X축 변인 및 단위 작성"></div>
 <div class="flex gap-2"><span class="font-semibold w-12">Y축</span><input id="exp${n}-yaxis" placeholder="Y축 변인 및 단위 작성"></div></div>
 </div><div class="bg-${c}-50 p-4 rounded-lg border border-${c}-200 flex flex-col">
 <span class="font-bold text-${c}-900"><i class="fa-solid fa-robot mr-2"></i>AI 선생님의 실험 설계 피드백</span>
 <p class="text-red-500 text-xs font-bold my-3">*주의! 먼저 상단의 '1차 제출하기'를 눌러야 피드백을 받을 수 있습니다.</p>
 <div id="exp${n}-waiting" class="flex-1 flex items-center justify-center text-center p-4 min-h-[150px]"><p class="text-${c}-800 font-bold text-sm">1차 제출 후 통합 피드백 버튼을 눌러주세요.</p></div>
 <div id="exp${n}-result" class="hidden flex-1 bg-white p-4 rounded border whitespace-pre-wrap"></div>
 <div class="mt-4 border-t pt-4"><label class="font-bold text-${c}-900 block mb-2 text-sm">피드백 반영 및 수정 내용 작성 (수정사항 없는 경우, '없음')</label><textarea id="exp${n}-reflection" rows="3"></textarea></div>
 </div></div></section>`;
}
document.write(experimentHtml(1,'blue'));
document.write(experimentHtml(2,'green'));
</script>

<div class="text-center text-gray-400 text-sm mt-8 pb-4">본 문서는 물질과 에너지 수업 수행평가용으로 제작된 인터렉티브 탐구 제안서 요약 보고서입니다.</div>
</div>
<div class="mt-8 mb-10 flex justify-center max-w-2xl mx-auto">
<button id="btn-final-submit" onclick="submitFinalDataAndDownload()" class="flex-1 bg-red-600 text-white font-bold py-4 px-6 rounded-xl shadow-xl text-lg"><i class="fa-solid fa-cloud-arrow-up mr-2"></i>구글 시트 최종 전송 및 요약 파일(.txt) 다운로드</button>
</div></div>

<div id="custom-modal" class="flex"><div class="bg-white rounded-lg p-6 max-w-2xl w-full mx-4 shadow-2xl text-center">
<h3 class="text-lg font-medium mb-2">알림</h3><p id="modal-message" class="text-sm text-gray-500 mb-4"></p>
<button onclick="closeModal()" class="w-full bg-blue-600 text-white py-2 rounded font-bold">확인</button></div></div>

<script>
const GOOGLE_SCRIPT_URL="https://script.google.com/macros/s/AKfycbyplWtnh2kdh5skNqqAVxRwKN_Plbm7JFkS6w28LLVY7ptp8BhWVlxC60xoYfz-o2Yfjw/exec";
let isFirstSubmitted=false,firstSubmitInProgress=false,finalSubmitInProgress=false,finalSubmitCompleted=false;
const LOCAL_DRAFT_KEY='reaction_rate_proposal_draft_v1';
function showMessage(m){document.getElementById('modal-message').innerText=m;document.getElementById('custom-modal').style.display='flex'}
function closeModal(){document.getElementById('custom-modal').style.display='none'}
function value(id){return document.getElementById(id)?.value?.trim()||""}
function getSteps(n){return [...document.querySelectorAll(`#exp${n}-steps textarea`)].map(x=>x.value.trim()).filter(Boolean)}
function getExperimentData(n){return{hypothesis:value(`exp${n}-hypothesis`),independentVariable:value(`exp${n}-var`),conditions:[value(`exp${n}-cond1`),value(`exp${n}-cond2`),value(`exp${n}-cond3`)],dependentVariable:value(`exp${n}-dep`),steps:getSteps(n),xAxis:value(`exp${n}-xaxis`),yAxis:value(`exp${n}-yaxis`)}}
function validateExperiment(n){const e=getExperimentData(n);if(!e.hypothesis)return`실험 ${n}의 탐구 가설을 작성해주세요.`;if(e.conditions.some(v=>!v))return`실험 ${n}의 조건값 3개를 모두 작성해주세요.`;if(!e.dependentVariable)return`실험 ${n}의 종속 변인을 작성해주세요.`;if(e.steps.length<3)return`실험 ${n}의 탐구 과정을 최소 3단계 이상 작성해주세요.`;if(!e.xAxis||!e.yAxis)return`실험 ${n}의 그래프 X축과 Y축을 작성해주세요.`;return""}
function collectLocalDraft(){const d={};document.querySelectorAll('input,textarea,select').forEach((el,i)=>d[el.id||`field_${i}`]={value:el.value});return d}
function saveDraftLocally(notice=true){localStorage.setItem(LOCAL_DRAFT_KEY,JSON.stringify({fields:collectLocalDraft()}));if(notice)showMessage("현재 입력 내용을 이 브라우저에 저장했습니다.")}
function loadDraftLocally(){const raw=localStorage.getItem(LOCAL_DRAFT_KEY);if(!raw)return showMessage("저장된 입력 내용이 없습니다.");const f=JSON.parse(raw).fields||{};document.querySelectorAll('input,textarea,select').forEach((el,i)=>{const x=f[el.id||`field_${i}`];if(x)el.value=x.value});showMessage("저장된 입력 내용을 불러왔습니다.")}
setInterval(()=>{if(!finalSubmitCompleted)saveDraftLocally(false)},5000);

async function submitData(submitType){
 const e1=getExperimentData(1),e2=getExperimentData(2);
 const payload={submitType,classroom:value('classroom'),studentId:value('studentId'),studentName:value('studentName'),topic:value('topic'),motive:value('motive'),purpose:value('purpose'),exp1_hypothesis:e1.hypothesis,exp1_var:e1.independentVariable,exp1_reflection:value('exp1-reflection'),exp2_hypothesis:e2.hypothesis,exp2_var:e2.independentVariable,exp2_reflection:value('exp2-reflection')};
 try{await fetch(GOOGLE_SCRIPT_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});return true}catch(e){console.error(e);showMessage("구글 시트로 전송 요청을 보내지 못했습니다.");return false}
}
async function submitFirstDraft(){
 if(firstSubmitInProgress||isFirstSubmitted)return showMessage("1차 제출이 이미 완료되었거나 처리 중입니다.");
 if(!value('classroom')||!value('studentId')||!value('studentName')||!value('topic')||!value('motive')||!value('purpose'))return showMessage("교실, 학번, 이름과 탐구 개요를 모두 작성해주세요.");
 const a=validateExperiment(1)||validateExperiment(2);if(a)return showMessage(a);
 firstSubmitInProgress=true;const ok=await submitData('1차 제출(초안)');firstSubmitInProgress=false;if(!ok)return;
 isFirstSubmitted=true;const b=document.getElementById('btn-feedback-combined');b.disabled=false;b.classList.remove('opacity-50','cursor-not-allowed');document.getElementById('feedback-lock-message').style.display='none';document.getElementById('btn-draft-combined').disabled=true;document.getElementById('btn-draft-combined').innerHTML='<i class="fa-solid fa-circle-check mr-1"></i>1차 제출 완료';showMessage("1차 제출이 완료되었습니다.");
}
function buildCombinedFeedbackPrompt(){
 const pack=(n,e)=>`[실험 ${n}]\n가설: ${e.hypothesis}\n조작변인: ${e.independentVariable}\n조건값: ${e.conditions.join(" / ")}\n측정값·종속변인: ${e.dependentVariable}\n탐구과정: ${e.steps.map((s,i)=>`${i+1}. ${s}`).join(" | ")}\nX축: ${e.xAxis}\nY축: ${e.yAxis}`;
 return `고등학교 화학 반응 속도 탐구 설계를 점검하세요. 학생은 이후 AI로 가상 실험 결과·그래프·시뮬레이션을 제작합니다.
탐구 주제·동기·목적은 피드백하지 마세요. 각 실험에서 가설, 조작변인·조건값, 측정값·종속변인, 탐구과정, 그래프 설계만 확인하세요.
그래프는 실제 가상 데이터로 그릴 수 있으면 인정하고 특정 형식을 강요하지 마세요. 문제가 없는 항목은 출력하지 마세요.
정답, 완성 문장, 구체적인 조건값, 완성된 실험 절차, 새로운 화학 반응은 대신 제시하지 마세요.
반드시 한 줄로 [실험1] ... [실험2] ... 형식으로 출력하세요. 문제가 여러 개면 " | "로 구분하세요.
${pack(1,getExperimentData(1))}
${pack(2,getExperimentData(2))}`;
}

/* 핵심 수정: Apps Script ContentService를 브라우저 fetch로 읽지 않고
   JSONP GET 요청으로 피드백 결과를 받습니다. */
function fetchFeedbackJSONP(promptText){
 return new Promise((resolve,reject)=>{
  const callbackName='geminiCallback_'+Date.now()+'_'+Math.floor(Math.random()*100000);
  const script=document.createElement('script');
  const timer=setTimeout(()=>cleanup(new Error("AI 피드백 서버 응답 시간이 초과되었습니다.")),60000);
  function cleanup(err,data){
   clearTimeout(timer);try{script.remove()}catch(_){}
   try{delete window[callbackName]}catch(_){window[callbackName]=undefined}
   if(err)reject(err);else resolve(data);
  }
  window[callbackName]=(data)=>cleanup(null,data);
  script.onerror=()=>cleanup(new Error("AI 피드백 서버에 연결하지 못했습니다."));
  const qs=new URLSearchParams({action:'geminiFeedback',callback:callbackName,prompt:promptText});
  script.src=GOOGLE_SCRIPT_URL+'?'+qs.toString();
  document.body.appendChild(script);
 });
}
async function getCombinedFeedback(){
 if(!isFirstSubmitted)return showMessage("먼저 1차 제출을 완료해주세요.");
 const err=validateExperiment(1)||validateExperiment(2);if(err)return showMessage(err);
 const btn=document.getElementById('btn-feedback-combined'),loading=document.getElementById('combined-loading'),result=document.getElementById('combined-feedback-result');
 btn.disabled=true;loading.classList.remove('hidden');loading.innerHTML='<i class="fa-solid fa-spinner fa-spin mr-2"></i>실험 1·2를 함께 점검하고 있습니다.';result.classList.add('hidden');
 try{
  const data=await fetchFeedbackJSONP(buildCombinedFeedbackPrompt());
  if(!data||data.ok===false)throw new Error(data?.error||data?.message||"AI 서버 오류");
  const feedback=String(data.feedback||data.text||"").replace(/\r?\n+/g,' ').replace(/\s{2,}/g,' ').trim();
  if(!feedback)throw new Error("피드백 내용이 없습니다.");
  const m=feedback.match(/\[실험1\]\s*(.*?)\s*\[실험2\]\s*(.*)$/);
  const r1=document.getElementById('exp1-result'),r2=document.getElementById('exp2-result');
  document.getElementById('exp1-waiting').classList.add('hidden');document.getElementById('exp2-waiting').classList.add('hidden');
  r1.textContent=m?m[1].trim():feedback;r2.textContent=m?m[2].trim():"피드백 내용을 구분하지 못했습니다.";r1.classList.remove('hidden');r2.classList.remove('hidden');
  result.textContent="실험 1과 실험 2의 피드백이 각 실험 설계 영역에 표시되었습니다.";result.classList.remove('hidden');
 }catch(e){console.error("AI feedback:",e);result.textContent="AI 피드백 요청에 실패했습니다: "+e.message;result.classList.remove('hidden')}
 finally{loading.classList.add('hidden');btn.disabled=false}
}
async function submitFinalDataAndDownload(){
 if(!isFirstSubmitted)return showMessage("먼저 1차 제출을 완료해주세요.");
 if(!value('exp1-reflection')||!value('exp2-reflection'))return showMessage("피드백 반영 내용을 작성해주세요. 수정사항이 없으면 '없음'이라고 작성해주세요.");
 const err=validateExperiment(1)||validateExperiment(2);if(err)return showMessage(err);
 const ok=await submitData('최종 제출(수정본)');if(!ok)return;
 const e1=getExperimentData(1),e2=getExperimentData(2),fmt=s=>s.map((x,i)=>`  ${i+1}. ${x}`).join("\n");
